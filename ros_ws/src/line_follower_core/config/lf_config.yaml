/line_follower_core:
  ros__parameters:
    image_topic: "/camera/image_raw"
    use_compressed: true
    cmd_vel_topic: "/cmd_vel"

    # ROI (доли кадра 0..1)
    roi_y_min: 0.65
    roi_y_max: 1.00
    roi_x_min: 0.00
    roi_x_max: 1.00

    # сегментация: 'hsv' или 'bgr' + пороги
    mode: "bgr"
    lower: [0, 0, 0]
    upper: [70, 70, 70]

    # морфология/площадь
    min_area: 1000
    morph_kernel: 3

    # управление
    steering_k: 0.03
    base_linear_speed: 0.18
    timer_period: 0.05
    max_omega: 2.0
    lost_behavior: "spin"
    search_omega: 0.6

    # отладочная картинка для RViz
    publish_debug: true
    debug_topic: "/line_follower/debug_image/compressed"